name: "Bug Report"
description: "Report an issue or bug with rootChat"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to report an issue!"
  - type: input
    id: version
    attributes:
      label: "rootChat Version"
      placeholder: "e.g., 0.7.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: "Operating System & Desktop Environment"
      placeholder: "e.g., Ubuntu 24.04 LTS (GNOME / Wayland / X11)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Step by step actions that reproduce the behavior."
      placeholder: "1. Open rootChat\n2. Click on Settings\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What you expected to happen."
    validations:
      required: true

